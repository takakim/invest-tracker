spring:
  application:
    name: invest-tracker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/invest_tracker}
    username: ${DATABASE_USERNAME:invest_tracker}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/backend.log}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
