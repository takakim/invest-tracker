spring:
  application:
    name: invest-tracker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/invest_tracker}
    username: ${DATABASE_USERNAME:invest_tracker}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

app:
  market-data:
    twelvedata:
      enabled: ${TWELVEDATA_ENABLED:true}
      api-key: ${TWELVEDATA_API_KEY:}
      base-url: ${TWELVEDATA_BASE_URL:https://api.twelvedata.com}
      connect-timeout-seconds: 5
      read-timeout-seconds: 10
    fmp:
      enabled: ${FMP_ENABLED:true}
      api-key: ${FMP_API_KEY:}
      base-url: ${FMP_BASE_URL:https://financialmodelingprep.com}
      connect-timeout-seconds: 5
      read-timeout-seconds: 10
      max-requests-per-minute: 5
    yahoo:
      enabled: ${YAHOO_FINANCE_ENABLED:true}
      base-url: ${YAHOO_FINANCE_BASE_URL:https://query1.finance.yahoo.com}
      connect-timeout-seconds: 5
      read-timeout-seconds: 10
      max-requests-per-minute: 30
    refresh-queue:
      worker-enabled: ${REFRESH_WORKER_ENABLED:true}
      interval-ms: ${REFRESH_WORKER_INTERVAL_MS:1500}
      retry-delay-seconds: ${REFRESH_RETRY_DELAY_SECONDS:30}
      max-attempts: ${REFRESH_MAX_ATTEMPTS:5}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:AUTO}
    base-url: ${AI_BASE_URL:http://localhost:1234}
    model: ${AI_MODEL:auto}
    api-key: ${AI_API_KEY:}
    temperature: ${AI_TEMPERATURE:0.2}
    max-tokens: ${AI_MAX_TOKENS:4096}
    reasoning-effort: ${AI_REASONING_EFFORT:none}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:1200}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    anthropic-base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: ${LOGGING_FILE_NAME:logs/backend.log}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.takakim.investtracker: ${LOGGING_LEVEL_APP:DEBUG}
