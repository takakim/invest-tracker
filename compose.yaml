services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invest_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-invest_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invest_tracker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invest_tracker}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-invest_tracker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-invest_tracker}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invest_tracker}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-invest_tracker}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-invest_tracker}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
