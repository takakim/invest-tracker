services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invest_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-invest_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invest_tracker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invest_tracker}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-invest_tracker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-invest_tracker}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-invest_tracker}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-invest_tracker}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-invest_tracker}
      TWELVEDATA_ENABLED: ${TWELVEDATA_ENABLED:-true}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      TWELVEDATA_BASE_URL: ${TWELVEDATA_BASE_URL:-https://api.twelvedata.com}
      FMP_ENABLED: ${FMP_ENABLED:-true}
      FMP_API_KEY: ${FMP_API_KEY:-}
      FMP_BASE_URL: ${FMP_BASE_URL:-https://financialmodelingprep.com}
      YAHOO_FINANCE_ENABLED: ${YAHOO_FINANCE_ENABLED:-true}
      YAHOO_FINANCE_BASE_URL: ${YAHOO_FINANCE_BASE_URL:-https://query1.finance.yahoo.com}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:1234}
      AI_MODEL: ${AI_MODEL:-google/gemma-4-12b}
      AI_API_KEY: ${AI_API_KEY:-}

    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres-data:
