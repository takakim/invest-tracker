openapi: 3.1.1
info:
  title: Invest Tracker API
  version: 1.0.0
  description: Phase 1 portfolio, account and instrument API. Authentication is deferred; deployment must not expose these endpoints without an appropriate authentication boundary.
servers:
  - url: /api/v1
paths:
  /portfolios:
    get:
      operationId: listPortfolios
      responses:
        '200':
          description: Active portfolios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Portfolio' }
    post:
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolio
      responses:
        '200':
          description: Portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updatePortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioCreate' }
      responses:
        '200':
          description: Updated portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archivePortfolio
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listAccounts
      responses:
        '200':
          description: Active accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: getAccount
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archiveAccount
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listPositions
      responses:
        '200':
          description: Account active positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPosition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/{positionId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/PositionId' }
    get:
      operationId: getPosition
      responses:
        '200':
          description: Position details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updatePosition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionUpdate' }
      responses:
        '200':
          description: Updated position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archivePosition
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/{positionId}/lots:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/PositionId' }
    get:
      operationId: getPositionLots
      responses:
        '200':
          description: Position tax lots and cost basis details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionLotsDetail' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/positions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listPortfolioPositions
      responses:
        '200':
          description: Portfolio active positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/positions/recalculate:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    post:
      operationId: recalculatePortfolioPositions
      responses:
        '200':
          description: Portfolio positions recalculation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionRecalculateResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/transactions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listTransactions
      parameters:
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TransactionType' }
      responses:
        '200':
          description: Account transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: recordTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Transaction recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/transactions/{transactionId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/TransactionId' }
    get:
      operationId: getTransaction
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: correctTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCorrect' }
      responses:
        '201':
          description: Replacement transaction recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/transactions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listPortfolioTransactions
      responses:
        '200':
          description: Portfolio transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/imports/preview:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    post:
      operationId: previewCsvImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '200':
          description: CSV import preview result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsvImportPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/imports:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listImportBatches
      responses:
        '200':
          description: Import history batches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportBatch' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: executeCsvImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '201':
          description: CSV import batch executed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments:
    get:
      operationId: listInstruments
      responses:
        '200':
          description: Instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Instrument' }
    post:
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /instruments/{instrumentId}:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    get:
      operationId: getInstrument
      responses:
        '200':
          description: Instrument
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    PortfolioId:
      in: path
      name: portfolioId
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, format: uuid }
    InstrumentId:
      in: path
      name: instrumentId
      required: true
      schema: { type: string, format: uuid }
    PositionId:
      in: path
      name: positionId
      required: true
      schema: { type: string, format: uuid }
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Portfolio:
      type: object
      required: [id, name, baseCurrency, costBasisMethod, returnMethod, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        baseCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        costBasisMethod: { $ref: '#/components/schemas/CostBasisMethod' }
        returnMethod: { $ref: '#/components/schemas/ReturnMethod' }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PortfolioCreate:
      type: object
      required: [name, baseCurrency, costBasisMethod, returnMethod]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        baseCurrency: { type: string, pattern: '^[A-Za-z]{3}$' }
        costBasisMethod: { $ref: '#/components/schemas/CostBasisMethod' }
        returnMethod: { $ref: '#/components/schemas/ReturnMethod' }
    CostBasisMethod:
      type: string
      enum: [FIFO, LIFO, AVERAGE_COST]
    ReturnMethod:
      type: string
      enum: [XIRR, TWR, MWR]
    Account:
      type: object
      required: [id, portfolioId, name, brokerName, accountCurrency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        brokerName: { type: string, minLength: 1, maxLength: 120 }
        accountCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [name, brokerName, accountCurrency]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        brokerName: { type: string, minLength: 1, maxLength: 120 }
        accountCurrency: { type: string, pattern: '^[A-Za-z]{3}$' }
    Instrument:
      type: object
      required: [id, name, assetClass, currency, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        assetClass: { $ref: '#/components/schemas/AssetClass' }
        ticker: { type: string, maxLength: 32, nullable: true }
        isin: { type: string, maxLength: 12, nullable: true }
        exchange: { type: string, maxLength: 80, nullable: true }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InstrumentCreate:
      type: object
      required: [name, assetClass, currency]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        assetClass: { $ref: '#/components/schemas/AssetClass' }
        ticker: { type: string, maxLength: 32, nullable: true }
        isin: { type: string, maxLength: 12, nullable: true }
        exchange: { type: string, maxLength: 80, nullable: true }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
    Position:
      type: object
      required: [id, accountId, instrumentId, instrumentName, assetClass, quantity, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        instrumentName: { type: string }
        instrumentTicker: { type: string, nullable: true }
        instrumentIsin: { type: string, nullable: true }
        assetClass: { $ref: '#/components/schemas/AssetClass' }
        quantity: { type: number, minimum: 0 }
        costBasisAmount: { type: number, minimum: 0, nullable: true }
        costBasisCurrency: { type: string, pattern: '^[A-Z]{3}$', nullable: true }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PositionCreate:
      type: object
      required: [instrumentId, quantity]
      properties:
        instrumentId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0 }
        costBasisAmount: { type: number, minimum: 0, nullable: true }
        costBasisCurrency: { type: string, pattern: '^[A-Za-z]{3}$', nullable: true }
    PositionUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: number, minimum: 0 }
        costBasisAmount: { type: number, minimum: 0, nullable: true }
        costBasisCurrency: { type: string, pattern: '^[A-Za-z]{3}$', nullable: true }
    PositionLot:
      type: object
      required: [lotId, acquisitionDate, originalQuantity, remainingQuantity, unitCostAmount, totalCostAmount, currency]
      properties:
        lotId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid, nullable: true }
        acquisitionDate: { type: string, format: date-time }
        originalQuantity: { type: number, minimum: 0 }
        remainingQuantity: { type: number, minimum: 0 }
        unitCostAmount: { type: number }
        totalCostAmount: { type: number }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
    PositionLotsDetail:
      type: object
      required: [positionId, accountId, instrumentId, costBasisMethod, totalQuantity, totalCostBasisAmount, currency, averageUnitCostAmount, realizedGainLossAmount, openLots]
      properties:
        positionId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        costBasisMethod: { type: string, enum: [FIFO, LIFO, AVERAGE_COST] }
        totalQuantity: { type: number }
        totalCostBasisAmount: { type: number }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        averageUnitCostAmount: { type: number }
        realizedGainLossAmount: { type: number }
        openLots:
          type: array
          items: { $ref: '#/components/schemas/PositionLot' }
    PositionRecalculateResponse:
      type: object
      required: [portfolioId, recalculatedPositionsCount, message]
      properties:
        portfolioId: { type: string, format: uuid }
        recalculatedPositionsCount: { type: integer }
        message: { type: string }
    TransactionType:
      type: string
      enum: [BUY, SELL, DIVIDEND, FEE, DEPOSIT, WITHDRAWAL, INTEREST, STOCK_SPLIT, REVERSE_STOCK_SPLIT, TRANSFER]
    Transaction:
      type: object
      required: [id, accountId, type, tradeDate, grossAmount, netAmount, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid, nullable: true }
        instrumentName: { type: string, nullable: true }
        instrumentTicker: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/TransactionType' }
        tradeDate: { type: string, format: date-time }
        settlementDate: { type: string, format: date-time, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        grossAmount: { type: number }
        feeAmount: { type: number, nullable: true }
        taxAmount: { type: number, nullable: true }
        netAmount: { type: number }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        fxRate: { type: number, nullable: true }
        counterCurrency: { type: string, pattern: '^[A-Z]{3}$', nullable: true }
        notes: { type: string, maxLength: 255, nullable: true }
        status: { type: string, enum: [COMPLETED, CORRECTED] }
        correctionOfTransactionId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransactionCreate:
      type: object
      required: [type, tradeDate, grossAmount, currency]
      properties:
        instrumentId: { type: string, format: uuid, nullable: true }
        type: { $ref: '#/components/schemas/TransactionType' }
        tradeDate: { type: string, format: date-time }
        settlementDate: { type: string, format: date-time, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        grossAmount: { type: number }
        feeAmount: { type: number, nullable: true }
        taxAmount: { type: number, nullable: true }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        fxRate: { type: number, nullable: true }
        counterCurrency: { type: string, pattern: '^[A-Za-z]{3}$', nullable: true }
        notes: { type: string, maxLength: 255, nullable: true }
        correctionOfTransactionId: { type: string, format: uuid, nullable: true }
    TransactionCorrect:
      type: object
      required: [replacementType, replacementTradeDate, replacementGrossAmount, replacementCurrency]
      properties:
        replacementInstrumentId: { type: string, format: uuid, nullable: true }
        replacementType: { $ref: '#/components/schemas/TransactionType' }
        replacementTradeDate: { type: string, format: date-time }
        replacementSettlementDate: { type: string, format: date-time, nullable: true }
        replacementQuantity: { type: number, nullable: true }
        replacementPrice: { type: number, nullable: true }
        replacementGrossAmount: { type: number }
        replacementFeeAmount: { type: number, nullable: true }
        replacementTaxAmount: { type: number, nullable: true }
        replacementCurrency: { type: string, pattern: '^[A-Za-z]{3}$' }
        replacementFxRate: { type: number, nullable: true }
        replacementCounterCurrency: { type: string, pattern: '^[A-Za-z]{3}$', nullable: true }
        replacementNotes: { type: string, maxLength: 255, nullable: true }
    CsvImportRequest:
      type: object
      required: [fileName, csvContent]
      properties:
        fileName: { type: string }
        csvContent: { type: string }
    PreviewRow:
      type: object
      required: [rowNumber, isDuplicate, isIgnored]
      properties:
        rowNumber: { type: integer }
        rawType: { type: string, nullable: true }
        mappedType: { type: string, nullable: true }
        instrumentTitle: { type: string, nullable: true }
        ticker: { type: string, nullable: true }
        isin: { type: string, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        grossAmount: { type: number, nullable: true }
        feeAmount: { type: number, nullable: true }
        taxAmount: { type: number, nullable: true }
        currency: { type: string, nullable: true }
        isDuplicate: { type: boolean }
        isIgnored: { type: boolean }
        diagnosticMessage: { type: string, nullable: true }
    CsvImportPreview:
      type: object
      required: [brokerName, fileName, totalRows, importableRows, duplicateRows, ignoredRows, rows]
      properties:
        brokerName: { type: string }
        fileName: { type: string }
        totalRows: { type: integer }
        importableRows: { type: integer }
        duplicateRows: { type: integer }
        ignoredRows: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PreviewRow' }
    ImportBatch:
      type: object
      required: [id, accountId, fileName, brokerType, status, totalRows, importedRows, skippedRows, createdAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        fileName: { type: string }
        brokerType: { type: string }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        totalRows: { type: integer }
        importedRows: { type: integer }
        skippedRows: { type: integer }
        createdAt: { type: string, format: date-time }
    AssetClass:
      type: string
      enum: [STOCK, ETF, MUTUAL_FUND, BOND, REIT, CRYPTO, CASH, OTHER]
