openapi: 3.1.1
info:
  title: Invest Tracker API
  version: 1.0.0
  description: |
    Design-level API contract for Invest Tracker. Authentication is intentionally
    deferred; public deployment must not expose these endpoints without it.
servers:
  - url: /api/v1
paths:
  /portfolios:
    get:
      operationId: listPortfolios
      responses:
        '200':
          description: Portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portfolio'
    post:
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400':
          $ref: '#/components/responses/Problem'
  /portfolios/{portfolioId}:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getPortfolio
      responses:
        '200':
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '404':
          $ref: '#/components/responses/Problem'
  /portfolios/{portfolioId}/accounts:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: listAccounts
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Problem'
  /accounts/{accountId}/transactions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: listTransactions
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: type
          schema: { $ref: '#/components/schemas/TransactionType' }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Transaction page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
    post:
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201':
          description: Created immutable transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /accounts/{accountId}/positions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: listPositions
      responses:
        '200':
          description: Current positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
  /portfolios/{portfolioId}/performance:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: getPortfolioPerformance
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
        - in: query
          name: currency
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200':
          description: Performance result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Performance'
  /portfolios/{portfolioId}/warnings:
    parameters:
      - $ref: '#/components/parameters/PortfolioId'
    get:
      operationId: listDataQualityWarnings
      responses:
        '200':
          description: Data-quality warnings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataQualityWarning'
  /instruments:
    get:
      operationId: listInstruments
      parameters:
        - in: query
          name: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Instruments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
components:
  parameters:
    PortfolioId:
      in: path
      name: portfolioId
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Portfolio:
      type: object
      required: [id, name, baseCurrency, performanceMethod]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        performanceMethod:
          type: string
          enum: [FIFO, LIFO, AVERAGE_COST]
    PortfolioCreate:
      type: object
      required: [name, baseCurrency, performanceMethod]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        performanceMethod:
          type: string
          enum: [FIFO, LIFO, AVERAGE_COST]
    Account:
      type: object
      required: [id, portfolioId, name]
      properties:
        id: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        brokerName: { type: string, maxLength: 200 }
    AccountCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        brokerName: { type: string, maxLength: 200 }
    Instrument:
      type: object
      required: [id, name, assetClass, nativeCurrency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        exchange: { type: string }
        assetClass:
          type: string
          enum: [STOCK, ETF, MUTUAL_FUND, BOND, REIT, CRYPTO, CASH]
        nativeCurrency: { type: string, minLength: 3, maxLength: 3 }
    TransactionType:
      type: string
      enum: [BUY, SELL, DIVIDEND, FEE, DEPOSIT, WITHDRAWAL, INTEREST, STOCK_SPLIT, REVERSE_STOCK_SPLIT, TRANSFER]
    TransactionCreate:
      type: object
      required: [type, effectiveAt, currency]
      properties:
        type: { $ref: '#/components/schemas/TransactionType' }
        instrumentId: { type: string, format: uuid }
        effectiveAt: { type: string, format: date-time }
        quantity: { type: number }
        price: { $ref: '#/components/schemas/Money' }
        grossAmount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        sourceReference: { type: string, maxLength: 500 }
    Transaction:
      allOf:
        - $ref: '#/components/schemas/TransactionCreate'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            immutable: { type: boolean, const: true }
    TransactionPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    Position:
      type: object
      required: [accountId, instrumentId, quantity]
      properties:
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        quantity: { type: number }
        marketValue: { $ref: '#/components/schemas/Money' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/DataQualityWarning' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
    Performance:
      type: object
      required: [from, to, currency]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency: { type: string, minLength: 3, maxLength: 3 }
        realizedGain: { $ref: '#/components/schemas/Money' }
        unrealizedGain: { $ref: '#/components/schemas/Money' }
        dividends: { $ref: '#/components/schemas/Money' }
        fees: { $ref: '#/components/schemas/Money' }
        taxes: { $ref: '#/components/schemas/Money' }
        totalReturn: { $ref: '#/components/schemas/Money' }
        annualizedReturn: { type: number }
        dataQualityWarnings:
          type: array
          items: { $ref: '#/components/schemas/DataQualityWarning' }
    DataQualityWarning:
      type: object
      required: [severity, dataType, message]
      properties:
        severity:
          type: string
          enum: [INFO, WARNING, ERROR]
        dataType:
          type: string
          enum: [PRICE, FX, CORPORATE_ACTION, DIVIDEND, OTHER]
        message: { type: string }
        instrumentId: { type: string, format: uuid }
        affectedDate: { type: string, format: date }
        resolved: { type: boolean }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
