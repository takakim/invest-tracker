openapi: 3.1.1
info:
  title: Invest Tracker API
  version: 1.0.0
  description: Phase 1 portfolio, account and instrument API. Authentication is deferred; deployment must not expose these endpoints without an appropriate authentication boundary.
servers:
  - url: /api/v1
paths:
  /portfolios:
    get:
      operationId: listPortfolios
      responses:
        '200':
          description: Active portfolios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Portfolio' }
    post:
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolio
      responses:
        '200':
          description: Portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updatePortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioCreate' }
      responses:
        '200':
          description: Updated portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archivePortfolio
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listAccounts
      responses:
        '200':
          description: Active accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: getAccount
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archiveAccount
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listPositions
      responses:
        '200':
          description: Account active positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPosition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/{positionId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/PositionId' }
    get:
      operationId: getPosition
      responses:
        '200':
          description: Position details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updatePosition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionUpdate' }
      responses:
        '200':
          description: Updated position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archivePosition
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/{positionId}/lots:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/PositionId' }
    get:
      operationId: getPositionLots
      responses:
        '200':
          description: Position tax lots and cost basis details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionLotsDetail' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/{positionId}/performance:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/PositionId' }
    get:
      operationId: getPositionPerformance
      responses:
        '200':
          description: Position performance details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionPerformance' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/performance:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listAccountPositionsPerformance
      parameters:
        - in: query
          name: includeClosed
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Account positions performance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PositionPerformance' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/positions/performance:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listPortfolioPositionsPerformance
      parameters:
        - in: query
          name: includeClosed
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Portfolio positions performance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PositionPerformance' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/positions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listPortfolioPositions
      responses:
        '200':
          description: Portfolio active positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/positions/recalculate:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    post:
      operationId: recalculatePortfolioPositions
      responses:
        '200':
          description: Portfolio positions recalculation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionRecalculateResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/performance:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolioPerformance
      summary: Get portfolio performance (TWR / MWR)
      description: |
        Returns time-weighted (TWR) or money-weighted (MWR) return analytics for the portfolio
        based on transaction cash flows and cost-basis valuations. XIRR is not yet supported
        and returns HTTP 501.
      responses:
        '200':
          description: Portfolio performance result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceResult' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/analytics:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolioAnalytics
      summary: Get portfolio analytics, exposures, and allocations
      parameters:
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Portfolio analytics with live valuations and allocation slices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioAnalytics' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/export/positions.csv:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: exportPositionsCsv
      summary: Export portfolio holdings and positions as CSV
      responses:
        '200':
          description: CSV file of portfolio positions
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/export/transactions.csv:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: exportTransactionsCsv
      summary: Export portfolio transaction ledger history as CSV
      responses:
        '200':
          description: CSV file of portfolio transactions
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/transactions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listTransactions
      parameters:
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TransactionType' }
      responses:
        '200':
          description: Account transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: recordTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Transaction recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/transactions/{transactionId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/TransactionId' }
    get:
      operationId: getTransaction
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: correctTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCorrect' }
      responses:
        '201':
          description: Replacement transaction recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/transactions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listPortfolioTransactions
      responses:
        '200':
          description: Portfolio transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/imports/preview:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    post:
      operationId: previewCsvImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '200':
          description: CSV import preview result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsvImportPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/imports:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listImportBatches
      responses:
        '200':
          description: Import history batches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportBatch' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: executeCsvImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '201':
          description: CSV import batch executed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments:
    get:
      operationId: listInstruments
      responses:
        '200':
          description: Instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Instrument' }
    post:
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /instruments/refresh-prices:
    post:
      operationId: refreshAllInstrumentPrices
      responses:
        '200':
          description: Refreshed instruments with latest quotes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Instrument' }
  /instruments/{instrumentId}/refresh-price:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    post:
      operationId: refreshInstrumentPrice
      responses:
        '200':
          description: Refreshed instrument with latest quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/{instrumentId}:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    get:
      operationId: getInstrument
      responses:
        '200':
          description: Instrument details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /instruments/{instrumentId}/quotes/latest:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    get:
      operationId: getLatestPriceQuote
      parameters:
        - in: query
          name: asOf
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Latest Price Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceQuote' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/{instrumentId}/quotes/override:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    post:
      operationId: recordMarketPriceOverride
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketPriceOverride' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketObservation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/{instrumentId}/quotes/history:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    get:
      operationId: getPriceHistory
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Price History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketObservation' }
        '404': { $ref: '#/components/responses/Problem' }
  /currencies/rates:
    get:
      operationId: getFxRate
      parameters:
        - in: query
          name: base
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: quote
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: asOf
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: FX Rate Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRateQuote' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /currencies/rates/override:
    post:
      operationId: recordFxRateOverride
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxRateOverride' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxObservation' }
        '400': { $ref: '#/components/responses/Problem' }
  /currencies/rates/history:
    get:
      operationId: getFxRateHistory
      parameters:
        - in: query
          name: base
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: quote
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: FX Rate History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FxObservation' }
  /portfolios/{portfolioId}/benchmark-comparison:
    get:
      summary: Compare portfolio performance to a benchmark index
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - in: query
          name: benchmarkInstrumentId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: period
          required: false
          schema: { type: string, enum: [1M, 3M, 6M, 1Y, YTD, ALL] }
        - in: query
          name: asOf
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Portfolio vs Benchmark comparison result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenchmarkComparison' }
        '404': { $ref: '#/components/responses/Problem' }
  /benchmarks:
    get:
      summary: List available benchmark indices and instruments
      responses:
        '200':
          description: List of available benchmark instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BenchmarkInstrument' }
  /system/reset-database:
    post:
      summary: Reset entire application database (Danger Zone)
      description: |
        Wipes all portfolios, accounts, positions, transactions, CSV import batches,
        and market observations. Requires confirmation: 'RESET'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmation
              properties:
                confirmation:
                  type: string
                  example: RESET
      responses:
        '200':
          description: Database reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    PortfolioId:
      in: path
      name: portfolioId
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, format: uuid }
    InstrumentId:
      in: path
      name: instrumentId
      required: true
      schema: { type: string, format: uuid }
    PositionId:
      in: path
      name: positionId
      required: true
      schema: { type: string, format: uuid }
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Portfolio:
      type: object
      required: [id, name, baseCurrency, costBasisMethod, returnMethod, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        baseCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        costBasisMethod: { $ref: '#/components/schemas/CostBasisMethod' }
        returnMethod: { $ref: '#/components/schemas/ReturnMethod' }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PortfolioCreate:
      type: object
      required: [name, baseCurrency, costBasisMethod, returnMethod]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        baseCurrency: { type: string, pattern: '^[A-Za-z]{3}$' }
        costBasisMethod: { $ref: '#/components/schemas/CostBasisMethod' }
        returnMethod: { $ref: '#/components/schemas/ReturnMethod' }
    CostBasisMethod:
      type: string
      enum: [FIFO, LIFO, AVERAGE_COST]
    ReturnMethod:
      type: string
      enum: [XIRR, TWR, MWR]
    Account:
      type: object
      required: [id, portfolioId, name, brokerName, accountCurrency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
