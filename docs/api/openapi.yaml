openapi: 3.1.1
info:
  title: Invest Tracker API
  version: 1.0.0
  description: Phase 1 portfolio, account and instrument API. Authentication is deferred; deployment must not expose these endpoints without an appropriate authentication boundary.
servers:
  - url: /api/v1
paths:
  /portfolios:
    get:
      operationId: listPortfolios
      responses:
        '200':
          description: Active portfolios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Portfolio' }
    post:
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolio
      responses:
        '200':
          description: Portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updatePortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioCreate' }
      responses:
        '200':
          description: Updated portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archivePortfolio
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listAccounts
      responses:
        '200':
          description: Active accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: getAccount
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archiveAccount
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listPositions
      responses:
        '200':
          description: Account active positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPosition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/{positionId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/PositionId' }
    get:
      operationId: getPosition
      responses:
        '200':
          description: Position details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updatePosition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionUpdate' }
      responses:
        '200':
          description: Updated position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: archivePosition
      responses:
        '204': { description: Archived }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/{positionId}/lots:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/PositionId' }
    get:
      operationId: getPositionLots
      responses:
        '200':
          description: Position tax lots and cost basis details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionLotsDetail' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/{positionId}/performance:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/PositionId' }
    get:
      operationId: getPositionPerformance
      responses:
        '200':
          description: Position performance details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionPerformance' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/positions/performance:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listAccountPositionsPerformance
      parameters:
        - in: query
          name: includeClosed
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Account positions performance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PositionPerformance' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/positions/performance:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listPortfolioPositionsPerformance
      parameters:
        - in: query
          name: includeClosed
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Portfolio positions performance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PositionPerformance' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/positions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listPortfolioPositions
      responses:
        '200':
          description: Portfolio active positions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/positions/recalculate:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    post:
      operationId: recalculatePortfolioPositions
      responses:
        '200':
          description: Portfolio positions recalculation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositionRecalculateResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/performance:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolioPerformance
      summary: Get portfolio performance (TWR / MWR)
      description: |
        Returns time-weighted (TWR) or money-weighted (MWR) return analytics for the portfolio
        based on transaction cash flows and cost-basis valuations. XIRR is not yet supported
        and returns HTTP 501.
      responses:
        '200':
          description: Portfolio performance result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceResult' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/analytics:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolioAnalytics
      summary: Get portfolio analytics, exposures, and allocations
      parameters:
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Portfolio analytics with live valuations and allocation slices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioAnalytics' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/analytics/dividends:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getDividendAnalytics
      summary: Get dividend analytics, historical distributions, forward projected income, and yields
      parameters:
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Dividend analytics response with realized dividends and forward projected yields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DividendAnalytics' }
  /portfolios/{portfolioId}/history:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolioHistory
      summary: Get historical portfolio valuation timeline, cash flows, and benchmark comparison
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: ['1M', '3M', '6M', 'YTD', '1Y', '3Y', 'ALL'], default: '1Y' }
        - name: interval
          in: query
          required: false
          schema: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
        - name: benchmarkId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Historical portfolio valuations and relative performance series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioHistory' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/cash-flows:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getCashFlowAnalytics
      summary: Get portfolio cash flow history, savings rate metrics, and wealth attribution
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: ['1M', '3M', '6M', 'YTD', '1Y', 'ALL'], default: 'ALL' }
        - name: groupBy
          in: query
          required: false
          schema: { type: string, enum: [MONTH, QUARTER, YEAR], default: 'MONTH' }
      responses:
        '200':
          description: Portfolio cash flow analytics breakdown and summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowAnalytics' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/export/cash-flows.csv:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: exportCashFlowsCsv
      summary: Export portfolio cash flows statement as CSV
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: ['1M', '3M', '6M', 'YTD', '1Y', 'ALL'], default: 'ALL' }
        - name: groupBy
          in: query
          required: false
          schema: { type: string, enum: [MONTH, QUARTER, YEAR], default: 'MONTH' }
      responses:
        '200':
          description: CSV file of portfolio cash flows
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/corporate-actions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolioCorporateActions
      summary: List corporate actions detected or applied to portfolio holdings
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, APPLIED, DISMISSED] }
      responses:
        '200':
          description: List of corporate actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CorporateAction' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/corporate-actions/scan:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    post:
      operationId: scanPortfolioCorporateActions
      summary: Scan market data providers for new corporate actions on held instruments
      responses:
        '200':
          description: Corporate action scan results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanCorporateActionsResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/corporate-actions/{actionId}/apply:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - name: actionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: applyCorporateAction
      summary: Apply a pending corporate action to the ledger and recalculate positions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyCorporateActionRequest' }
      responses:
        '200':
          description: Corporate action successfully applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporateAction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/corporate-actions/{actionId}/dismiss:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - name: actionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: dismissCorporateAction
      summary: Dismiss a pending corporate action
      responses:
        '200':
          description: Corporate action dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorporateAction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/tax-allowances:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getPortfolioTaxReport
      summary: Calculate Capital Gains Tax (CGT), dividend allowances, and tax-loss harvesting for a portfolio
      parameters:
        - name: taxYear
          in: query
          required: false
          schema: { type: string, example: "2024/25" }
        - name: regime
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaxRegime' }
      responses:
        '200':
          description: Comprehensive tax report for the portfolio and tax year
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxReportResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/tax-allowances/available-years:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getAvailableTaxYears
      summary: Retrieve all tax years with transaction activity in the portfolio
      responses:
        '200':
          description: Available UK and Calendar tax years
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailableTaxYearsResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/tax-allowances/settings:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    put:
      operationId: updatePortfolioTaxSettings
      summary: Override statutory tax allowances or record carried-forward capital losses
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxSettingsRequest' }
      responses:
        '200':
          description: Updated portfolio tax settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxSettingsResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/target-allocation:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getTargetAllocation
      summary: Get target asset allocation plan and items for a portfolio
      responses:
        '200':
          description: Target allocation plan details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetAllocationPlan' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveTargetAllocation
      summary: Create or update target asset allocation plan and items for a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetAllocationPlanRequest' }
      responses:
        '200':
          description: Saved target allocation plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetAllocationPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteTargetAllocation
      summary: Delete target asset allocation plan for a portfolio
      responses:
        '204':
          description: Target allocation plan deleted successfully
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/rebalancing:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: getRebalancingAnalysis
      summary: Calculate portfolio drift and generate rebalancing trade orders
      parameters:
        - name: cashInjection
          in: query
          required: false
          schema: { type: number, minimum: 0 }
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Rebalancing analysis with recommended buy/sell/hold orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RebalanceAnalysis' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/export/positions.csv:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: exportPositionsCsv
      summary: Export portfolio holdings and positions as CSV
      responses:
        '200':
          description: CSV file of portfolio positions
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/export/transactions.csv:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: exportTransactionsCsv
      summary: Export portfolio transaction ledger history as CSV
      responses:
        '200':
          description: CSV file of portfolio transactions
          content:
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/export/executive-summary.pdf:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: exportExecutiveSummaryPdf
      summary: Export comprehensive executive summary audit report as printable PDF
      responses:
        '200':
          description: Printable PDF document of portfolio valuation and performance audit
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/export/tax-report.pdf:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: exportTaxReportPdf
      summary: Export tax-year audit statement with CGT and dividend breakdown as printable PDF
      parameters:
        - name: taxYear
          in: query
          required: false
          schema: { type: string, example: '2024/2025' }
        - name: regime
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TaxRegime' }
      responses:
        '200':
          description: Printable PDF document of tax-year audit statement
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
  /ai/status:
    get:
      operationId: getAiStatus
      summary: Check local LM Studio connection status and model availability
      responses:
        '200':
          description: AI system status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiStatus' }
  /portfolios/{portfolioId}/ai/evaluate:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    post:
      operationId: evaluatePortfolioAi
      summary: Run comprehensive AI evaluation on the portfolio
      responses:
        '200':
          description: Portfolio AI evaluation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioAiEvaluation' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/holdings/{instrumentId}/ai/evaluate:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/InstrumentId' }
    post:
      operationId: evaluateHoldingAi
      summary: Run deep-dive AI evaluation on an individual holding
      responses:
        '200':
          description: Holding AI evaluation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldingAiEvaluation' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/transactions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listTransactions
      parameters:
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TransactionType' }
      responses:
        '200':
          description: Account transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: recordTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Transaction recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/transactions/{transactionId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - { $ref: '#/components/parameters/TransactionId' }
    get:
      operationId: getTransaction
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: correctTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCorrect' }
      responses:
        '201':
          description: Replacement transaction recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateTransaction
      summary: Update transaction in place
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/transactions:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
    get:
      operationId: listPortfolioTransactions
      responses:
        '200':
          description: Portfolio transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
  /imports/supported-brokers:
    get:
      operationId: getSupportedBrokers
      summary: Get list of all supported CSV import broker templates
      responses:
        '200':
          description: List of supported broker names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /imports/detect-broker:
    post:
      operationId: detectBroker
      summary: Auto-detect broker CSV template and format confidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrokerDetectionRequest' }
      responses:
        '200':
          description: Broker auto-detection result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrokerDetectionResponse' }
        '400': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/imports/preview:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    post:
      operationId: previewCsvImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '200':
          description: CSV import preview result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsvImportPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/imports:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
    get:
      operationId: listImportBatches
      responses:
        '200':
          description: Import history batches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportBatch' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: executeCsvImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CsvImportRequest' }
      responses:
        '201':
          description: CSV import batch executed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /portfolios/{portfolioId}/accounts/{accountId}/imports/{batchId}:
    parameters:
      - { $ref: '#/components/parameters/PortfolioId' }
      - { $ref: '#/components/parameters/AccountId' }
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteImportBatch
      summary: Roll back an import batch and all its transactions
      responses:
        '204':
          description: Import batch deleted and positions resynced
        '404': { $ref: '#/components/responses/Problem' }
  /instruments:
    get:
      operationId: listInstruments
      responses:
        '200':
          description: Instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Instrument' }
    post:
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /instruments/refresh-prices:
    post:
      operationId: refreshAllInstrumentPrices
      responses:
        '200':
          description: Refreshed instruments with latest quotes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Instrument' }
  /instruments/{instrumentId}/refresh-price:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    post:
      operationId: refreshInstrumentPrice
      responses:
        '200':
          description: Refreshed instrument with latest quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/refresh-queue/status:
    get:
      operationId: getRefreshQueueStatus
      responses:
        '200':
          description: Status of the market data refresh queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshQueueStatus' }
  /instruments/{instrumentId}:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    get:
      operationId: getInstrument
      responses:
        '200':
          description: Instrument details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstrumentCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instrument' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /instruments/{instrumentId}/quotes/latest:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    get:
      operationId: getLatestPriceQuote
      parameters:
        - in: query
          name: asOf
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Latest Price Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceQuote' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/{instrumentId}/quotes/override:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    post:
      operationId: recordMarketPriceOverride
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketPriceOverride' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketObservation' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /instruments/{instrumentId}/quotes/history:
    parameters:
      - { $ref: '#/components/parameters/InstrumentId' }
    get:
      operationId: getPriceHistory
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Price History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketObservation' }
        '404': { $ref: '#/components/responses/Problem' }
  /currencies/rates:
    get:
      operationId: getFxRate
      parameters:
        - in: query
          name: base
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: quote
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: asOf
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: FX Rate Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRateQuote' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /currencies/rates/refresh:
    post:
      summary: Enqueue asynchronous market data refresh tasks for active currency pairs
      operationId: refreshFxRates
      parameters:
        - in: query
          name: base
          required: false
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: quote
          required: false
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
      responses:
        '202':
          description: Accepted for asynchronous background processing
          content:
            application/json:
              schema:
                type: object
  /currencies/rates/override:
    post:
      operationId: recordFxRateOverride
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FxRateOverride' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxObservation' }
        '400': { $ref: '#/components/responses/Problem' }
  /currencies/rates/history:
    get:
      operationId: getFxRateHistory
      parameters:
        - in: query
          name: base
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: quote
          required: true
          schema: { type: string, pattern: '^[A-Za-z]{3}$' }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: FX Rate History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FxObservation' }
  /portfolios/{portfolioId}/benchmark-comparison:
    get:
      summary: Compare portfolio performance to a benchmark index
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - in: query
          name: benchmarkInstrumentId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: period
          required: false
          schema: { type: string, enum: [1M, 3M, 6M, 1Y, YTD, ALL] }
        - in: query
          name: asOf
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Portfolio vs Benchmark comparison result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenchmarkComparison' }
        '404': { $ref: '#/components/responses/Problem' }
  /benchmarks:
    get:
      summary: List available benchmark indices and instruments
      responses:
        '200':
          description: List of available benchmark instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BenchmarkInstrument' }
  /system/reset-database:
    post:
      summary: Reset entire application database (Danger Zone)
      description: |
        Wipes all portfolios, accounts, positions, transactions, CSV import batches,
        and market observations. Requires confirmation: 'RESET'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmation
              properties:
                confirmation:
                  type: string
                  example: RESET
      responses:
        '200':
          description: Database reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    PortfolioId:
      in: path
      name: portfolioId
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, format: uuid }
    InstrumentId:
      in: path
      name: instrumentId
      required: true
      schema: { type: string, format: uuid }
    PositionId:
      in: path
      name: positionId
      required: true
      schema: { type: string, format: uuid }
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Portfolio:
      type: object
      required: [id, name, baseCurrency, costBasisMethod, returnMethod, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        baseCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        costBasisMethod: { $ref: '#/components/schemas/CostBasisMethod' }
        returnMethod: { $ref: '#/components/schemas/ReturnMethod' }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PortfolioCreate:
      type: object
      required: [name, baseCurrency, costBasisMethod, returnMethod]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        baseCurrency: { type: string, pattern: '^[A-Za-z]{3}$' }
        costBasisMethod: { $ref: '#/components/schemas/CostBasisMethod' }
        returnMethod: { $ref: '#/components/schemas/ReturnMethod' }
    CostBasisMethod:
      type: string
      enum: [FIFO, LIFO, AVERAGE_COST]
    ReturnMethod:
      type: string
      enum: [XIRR, TWR, MWR]
    AccountTaxTreatment:
      type: string
      enum: [TAXABLE, TAX_EXEMPT, TAX_DEFERRED]
    Account:
      type: object
      required: [id, portfolioId, name, brokerName, accountCurrency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        brokerName: { type: string, minLength: 1, maxLength: 120 }
        accountCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        taxTreatment: { $ref: '#/components/schemas/AccountTaxTreatment' }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [name, brokerName, accountCurrency]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        brokerName: { type: string, minLength: 1, maxLength: 120 }
        accountCurrency: { type: string, pattern: '^[A-Za-z]{3}$' }
        taxTreatment: { $ref: '#/components/schemas/AccountTaxTreatment' }
    Instrument:
      type: object
      required: [id, name, assetClass, currency, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        assetClass: { $ref: '#/components/schemas/AssetClass' }
        ticker: { type: string, maxLength: 32, nullable: true }
        isin: { type: string, maxLength: 12, nullable: true }
        exchange: { type: string, maxLength: 80, nullable: true }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        manualPriceOnly: { type: boolean, default: false }
        latestPrice: { type: number, nullable: true }
        priceCurrency: { type: string, pattern: '^[A-Za-z]{3}$', nullable: true }
        priceAsOf: { type: string, format: date-time, nullable: true }
        isStale: { type: boolean, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InstrumentCreate:
      type: object
      required: [name, assetClass, currency]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        assetClass: { $ref: '#/components/schemas/AssetClass' }
        ticker: { type: string, maxLength: 32, nullable: true }
        isin: { type: string, maxLength: 12, nullable: true }
        exchange: { type: string, maxLength: 80, nullable: true }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        manualPriceOnly: { type: boolean, default: false }
    RefreshQueueStatus:
      type: object
      required: [pendingCount, processingCount, failedCount]
      properties:
        pendingCount: { type: integer, format: int64 }
        processingCount: { type: integer, format: int64 }
        failedCount: { type: integer, format: int64 }
    Position:
      type: object
      required: [id, accountId, instrumentId, instrumentName, assetClass, quantity, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        instrumentName: { type: string }
        instrumentTicker: { type: string, nullable: true }
        instrumentIsin: { type: string, nullable: true }
        assetClass: { $ref: '#/components/schemas/AssetClass' }
        quantity: { type: number, minimum: 0 }
        costBasisAmount: { type: number, minimum: 0, nullable: true }
        costBasisCurrency: { type: string, pattern: '^[A-Z]{3}$', nullable: true }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PositionCreate:
      type: object
      required: [instrumentId, quantity]
      properties:
        instrumentId: { type: string, format: uuid }
        quantity: { type: number, minimum: 0 }
        costBasisAmount: { type: number, minimum: 0, nullable: true }
        costBasisCurrency: { type: string, pattern: '^[A-Za-z]{3}$', nullable: true }
    PositionUpdate:
      type: object
      required: [quantity]
      properties:
        quantity: { type: number, minimum: 0 }
        costBasisAmount: { type: number, minimum: 0, nullable: true }
        costBasisCurrency: { type: string, pattern: '^[A-Za-z]{3}$', nullable: true }
    PositionLot:
      type: object
      required: [lotId, acquisitionDate, originalQuantity, remainingQuantity, unitCostAmount, totalCostAmount, currency]
      properties:
        lotId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid, nullable: true }
        acquisitionDate: { type: string, format: date-time }
        originalQuantity: { type: number, minimum: 0 }
        remainingQuantity: { type: number, minimum: 0 }
        unitCostAmount: { type: number }
        totalCostAmount: { type: number }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
    LotDisposal:
      type: object
      required: [transactionId, lotId, disposalDate, quantity, costBasis, proceeds, realizedGainLoss, currency]
      properties:
        transactionId: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
        disposalDate: { type: string, format: date-time }
        quantity: { type: number }
        costBasis: { type: number }
        proceeds: { type: number }
        realizedGainLoss: { type: number }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
    PositionLotsDetail:
      type: object
      required: [positionId, accountId, instrumentId, costBasisMethod, totalQuantity, totalCostBasisAmount, currency, averageUnitCostAmount, realizedGainLossAmount, openLots]
      properties:
        positionId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        costBasisMethod: { type: string, enum: [FIFO, LIFO, AVERAGE_COST] }
        totalQuantity: { type: number }
        totalCostBasisAmount: { type: number }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        averageUnitCostAmount: { type: number }
        realizedGainLossAmount: { type: number }
        openLots:
          type: array
          items: { $ref: '#/components/schemas/PositionLot' }
    PositionPerformance:
      type: object
      required: [positionId, accountId, accountName, instrumentId, instrumentName, assetClass, status, currentQuantity, totalBoughtQuantity, totalSoldQuantity, totalInvestedAmount, totalProceedsAmount, netTotalReturnAmount, totalReturnPercentage, currency]
      properties:
        positionId: { type: string, format: uuid, nullable: true }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        instrumentId: { type: string, format: uuid }
        instrumentName: { type: string }
        ticker: { type: string, nullable: true }
        isin: { type: string, nullable: true }
        assetClass: { $ref: '#/components/schemas/AssetClass' }
        status: { type: string, enum: [ACTIVE, CLOSED, ARCHIVED] }
        currentQuantity: { type: number }
        totalBoughtQuantity: { type: number }
        totalSoldQuantity: { type: number }
        averageBuyPrice: { type: number }
        averageSellPrice: { type: number }
        totalInvestedAmount: { type: number }
        totalProceedsAmount: { type: number }
        currentCostBasis: { type: number }
        currentPrice: { type: number }
        currentMarketValue: { type: number }
        realizedGainLoss: { type: number }
        unrealizedGainLoss: { type: number }
        dividendIncome: { type: number }
        fees: { type: number }
        taxes: { type: number }
        netTotalReturnAmount: { type: number }
        totalReturnPercentage: { type: number }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        nativePrice: { type: number, nullable: true }
        nativeCurrency: { type: string, nullable: true }
        nativeNetTotalReturnAmount: { type: number, nullable: true }
        nativeReturnPercentage: { type: number, nullable: true }
        openLots:
          type: array
          items: { $ref: '#/components/schemas/PositionLot' }
        disposals:
          type: array
          items: { $ref: '#/components/schemas/LotDisposal' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
    PositionRecalculateResponse:
      type: object
      required: [portfolioId, recalculatedPositionsCount, message]
      properties:
        portfolioId: { type: string, format: uuid }
        recalculatedPositionsCount: { type: integer }
        message: { type: string }
    TransactionType:
      type: string
      enum: [BUY, SELL, DIVIDEND, FEE, DEPOSIT, WITHDRAWAL, INTEREST, STOCK_SPLIT, REVERSE_STOCK_SPLIT, TRANSFER]
    Transaction:
      type: object
      required: [id, accountId, type, tradeDate, grossAmount, netAmount, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid, nullable: true }
        instrumentName: { type: string, nullable: true }
        instrumentTicker: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/TransactionType' }
        tradeDate: { type: string, format: date-time }
        settlementDate: { type: string, format: date-time, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        grossAmount: { type: number }
        feeAmount: { type: number, nullable: true }
        taxAmount: { type: number, nullable: true }
        netAmount: { type: number }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        fxRate: { type: number, nullable: true }
        counterCurrency: { type: string, pattern: '^[A-Z]{3}$', nullable: true }
        notes: { type: string, maxLength: 255, nullable: true }
        status: { type: string, enum: [COMPLETED, CORRECTED] }
        correctionOfTransactionId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransactionCreate:
      type: object
      required: [type, tradeDate, grossAmount, currency]
      properties:
        instrumentId: { type: string, format: uuid, nullable: true }
        type: { $ref: '#/components/schemas/TransactionType' }
        tradeDate: { type: string, format: date-time }
        settlementDate: { type: string, format: date-time, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        grossAmount: { type: number }
        feeAmount: { type: number, nullable: true }
        taxAmount: { type: number, nullable: true }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        fxRate: { type: number, nullable: true }
        counterCurrency: { type: string, pattern: '^[A-Za-z]{3}$', nullable: true }
        notes: { type: string, maxLength: 255, nullable: true }
